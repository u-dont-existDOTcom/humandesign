{
  "openapi": "3.1.0",
  "info": {
    "title": "Life Patterns Independent Review Pilot",
    "version": "1.3.0",
    "description": "Asynchronous independent review and exact-source submission for the development pilot."
  },
  "servers": [
    {
      "url": "https://life-patterns-participant-production.up.railway.app"
    }
  ],
  "paths": {
    "/api/gpt/reviews": {
      "post": {
        "operationId": "startLifePatternsReview",
        "summary": "Queue independent review before primary freeze",
        "description": "Queue the exact unfrozen candidate with review_protocol fast-batch-v1. Preserve its private review ID. Show the returned stage estimate and recommended_check_after_seconds. First questions and full final review are separate stages; queued is not ready.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Saved result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReviewStatus"
                }
              }
            }
          },
          "401": {
            "description": "Access credentials are missing or invalid."
          },
          "409": {
            "description": "The request is stale or conflicts with saved state."
          },
          "422": {
            "description": "Request rejected. Read safe errors[].path/code/hint; preserve exact backup and repair serialization or envelope only."
          }
        },
        "x-openai-isConsequential": true,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReviewStart"
              }
            }
          }
        }
      }
    },
    "/api/gpt/reviews/{review_id}": {
      "get": {
        "operationId": "getLifePatternsReview",
        "summary": "Check saved review status",
        "description": "Read the same saved review. Report review_stage_label, wait_guidance and recommended_check_after_seconds. Stage estimates are not deadlines. Queued/offline/overdue work has no reliable remaining-time promise. Do not poll repeatedly.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Saved result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReviewStatus"
                }
              }
            }
          },
          "401": {
            "description": "Access credentials are missing or invalid."
          },
          "409": {
            "description": "The request is stale or conflicts with saved state."
          },
          "422": {
            "description": "Invalid data; saved source remains unchanged."
          }
        },
        "parameters": [
          {
            "name": "review_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^R-[a-f0-9]{32}$"
            }
          }
        ],
        "x-openai-isConsequential": false
      }
    },
    "/api/gpt/reviews/{review_id}/clarifications": {
      "post": {
        "operationId": "submitLifePatternsClarification",
        "summary": "Save an exact clarification answer or explicit skip",
        "description": "Send the answer with the exact clarification_id issued by the review. Reuse operation_id and body for a retry. Set skipped only for an explicit participant skip. This saves the response and queues a new independent pass; use recommended_check_after_seconds to tell the participant when to return.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Saved result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReviewStatus"
                }
              }
            }
          },
          "401": {
            "description": "Access credentials are missing or invalid."
          },
          "409": {
            "description": "The request is stale or conflicts with saved state."
          },
          "422": {
            "description": "Invalid data; saved source remains unchanged."
          }
        },
        "x-openai-isConsequential": true,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ClarificationAnswer"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "review_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^R-[a-f0-9]{32}$"
            }
          }
        ]
      }
    },
    "/api/gpt/reviews/{review_id}/control": {
      "post": {
        "operationId": "controlLifePatternsReview",
        "summary": "Pause, resume, stop, or retry a saved review",
        "description": "Honor pause, stop or withdrawal. Withdrawal clears an unsubmitted review. Resume only when requested. Retry the same review only after a recoverable worker error or resource limit has been repaired; never create a replacement review.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Saved result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReviewStatus"
                }
              }
            }
          },
          "401": {
            "description": "Access credentials are missing or invalid."
          },
          "409": {
            "description": "The request is stale or conflicts with saved state."
          },
          "422": {
            "description": "Invalid data; saved source remains unchanged."
          }
        },
        "x-openai-isConsequential": true,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReviewControl"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "review_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^R-[a-f0-9]{32}$"
            }
          }
        ]
      }
    },
    "/api/gpt/reviewed-submissions": {
      "post": {
        "operationId": "submitLifePatternsRecords",
        "summary": "Submit independently reviewed frozen records",
        "description": "After ready, participant review and primary freeze, ask the three CF-003 questions and freeze them separately. Submit the ready review ID and both exact records. A successful receipt confirms storage, not scientific validity.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Saved result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Receipt"
                }
              }
            }
          },
          "401": {
            "description": "Access credentials are missing or invalid."
          },
          "409": {
            "description": "The request is stale or conflicts with saved state."
          },
          "422": {
            "description": "Invalid data; saved source remains unchanged."
          }
        },
        "x-openai-isConsequential": true,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Submission"
              }
            }
          }
        }
      }
    },
    "/api/gpt/reviews/{review_id}/clarification-batches": {
      "post": {
        "operationId": "submitLifePatternsClarificationBatch",
        "summary": "Save an ordered batch of exact answers or skips",
        "description": "Ask supplied questions one at a time locally. Send exact answers/skips in batch order with the issued batch_id. An answered prefix may be sent early if a later question no longer fits; unasked remainder is invalidated, not skipped. Reuse operation_id and identical body on retries.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Saved result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReviewStatus"
                }
              }
            }
          },
          "401": {
            "description": "Access credentials are missing or invalid."
          },
          "409": {
            "description": "The request is stale or conflicts with saved state."
          },
          "422": {
            "description": "Invalid data; saved source remains unchanged."
          }
        },
        "x-openai-isConsequential": true,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ClarificationBatchAnswers"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "review_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^R-[a-f0-9]{32}$"
            }
          }
        ]
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "ReviewStart": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "research_use_consented": {
            "type": "boolean",
            "const": true
          },
          "request_id": {
            "type": "string",
            "minLength": 16,
            "maxLength": 80,
            "pattern": "^[a-zA-Z0-9_-]+$",
            "description": "Random per-operation identifier. Reuse the exact identifier and body when retrying."
          },
          "candidate_record": {
            "type": "object",
            "additionalProperties": true,
            "description": "Exact unfrozen primary source record with explicit consent and all source turns; no CF-003 answers.",
            "required": [
              "schema",
              "consent",
              "turns",
              "freeze"
            ],
            "properties": {
              "schema": {
                "type": "string",
                "const": "life-patterns-full-survey-participant-export-v2"
              },
              "consent": {
                "type": "object",
                "required": [
                  "research_use_consented"
                ],
                "properties": {
                  "research_use_consented": {
                    "type": "boolean",
                    "const": true
                  }
                },
                "additionalProperties": true
              },
              "turns": {
                "type": "array",
                "items": {
                  "type": "object",
                  "required": [
                    "question_text",
                    "answer_text"
                  ],
                  "properties": {
                    "turn_id": {
                      "type": "string"
                    },
                    "question_text": {
                      "type": [
                        "string",
                        "null"
                      ]
                    },
                    "answer_text": {
                      "type": [
                        "string",
                        "null"
                      ]
                    }
                  },
                  "additionalProperties": true
                }
              },
              "freeze": {
                "type": "object",
                "properties": {
                  "record_state": {
                    "type": "string",
                    "const": "candidate"
                  },
                  "frozen_before_birth_or_chart_reveal": {
                    "type": "boolean",
                    "const": false
                  }
                },
                "additionalProperties": true
              }
            }
          },
          "review_protocol": {
            "type": "string",
            "enum": [
              "legacy-v1",
              "fast-batch-v1"
            ],
            "description": "Use fast-batch-v1 for a new review. Recover an existing request with its unchanged saved body, including an omitted legacy protocol."
          }
        },
        "required": [
          "research_use_consented",
          "request_id",
          "candidate_record"
        ],
        "example": {
          "research_use_consented": true,
          "request_id": "0123456789abcdef0123456789abcdef",
          "candidate_record": {
            "schema": "life-patterns-full-survey-participant-export-v2",
            "consent": {
              "research_use_consented": true
            },
            "collection_mode": "chatgpt_text",
            "turns": [
              {
                "turn_id": "example-1",
                "question_text": "What usually helps you decide?",
                "answer_text": "I compare the practical options.",
                "canonical_question_id": null,
                "turn_role": "behavioral"
              }
            ],
            "participant_review": {
              "summary_shown": false
            },
            "freeze": {
              "record_state": "candidate",
              "frozen_before_birth_or_chart_reveal": false
            }
          },
          "review_protocol": "fast-batch-v1"
        }
      },
      "ClarificationAnswer": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "clarification_id": {
            "type": "string",
            "pattern": "^Q-[a-f0-9]{32}$"
          },
          "operation_id": {
            "type": "string",
            "minLength": 16,
            "maxLength": 80,
            "pattern": "^[a-zA-Z0-9_-]+$",
            "description": "Random per-operation identifier. Reuse the exact identifier and body when retrying."
          },
          "answer_text": {
            "type": "string",
            "maxLength": 20000
          },
          "skipped": {
            "type": "boolean"
          }
        },
        "required": [
          "clarification_id",
          "operation_id",
          "answer_text"
        ]
      },
      "ReviewControl": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "action": {
            "type": "string",
            "enum": [
              "pause",
              "resume",
              "stop",
              "retry",
              "withdraw"
            ]
          },
          "operation_id": {
            "type": "string",
            "minLength": 16,
            "maxLength": 80,
            "pattern": "^[a-zA-Z0-9_-]+$",
            "description": "Random per-operation identifier. Reuse the exact identifier and body when retrying."
          }
        },
        "required": [
          "action",
          "operation_id"
        ]
      },
      "Clarification": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "clarification_id": {
            "type": "string",
            "pattern": "^Q-[a-f0-9]{32}$"
          },
          "route_id": {
            "type": "string"
          },
          "route_type": {
            "type": "string",
            "enum": [
              "canonical",
              "context_repair",
              "missing_piece_followup"
            ]
          },
          "question_text": {
            "type": "string"
          },
          "antecedent_turn_ids": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "required": [
          "clarification_id",
          "route_id",
          "route_type",
          "question_text",
          "antecedent_turn_ids"
        ]
      },
      "ReviewStatus": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "schema": {
            "type": "string",
            "const": "life-patterns-gpt-review-status-v1"
          },
          "review_id": {
            "type": "string",
            "pattern": "^R-[a-f0-9]{32}$"
          },
          "status": {
            "type": "string",
            "enum": [
              "queued",
              "processing",
              "clarification_needed",
              "ready",
              "error",
              "paused",
              "stopped",
              "resource_limited",
              "withdrawn"
            ]
          },
          "round": {
            "type": "integer",
            "minimum": 0
          },
          "duplicate": {
            "type": "boolean"
          },
          "clarification": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Clarification"
              },
              {
                "type": "null"
              }
            ]
          },
          "error": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "review_summary": {
            "anyOf": [
              {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "evidence_id": {
                      "type": "string"
                    },
                    "observation": {
                      "type": "string"
                    },
                    "conditions": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    },
                    "time_frame": {
                      "type": "string"
                    },
                    "relationship_context": {
                      "type": "string"
                    },
                    "source_quotes": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "additionalProperties": false,
                        "properties": {
                          "turn_id": {
                            "type": "string"
                          },
                          "quote": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "turn_id",
                          "quote"
                        ]
                      }
                    }
                  },
                  "required": [
                    "evidence_id",
                    "observation",
                    "conditions",
                    "time_frame",
                    "relationship_context",
                    "source_quotes"
                  ]
                }
              },
              {
                "type": "null"
              }
            ]
          },
          "source_review_status": {
            "type": "string"
          },
          "recommended_check_after_seconds": {
            "type": "integer",
            "minimum": 0,
            "description": "Suggested seconds before the participant checks this same saved review again. Zero means no waiting is recommended because the current state needs participant or final handling."
          },
          "review_protocol": {
            "type": "string"
          },
          "batch_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "clarifications": {
            "anyOf": [
              {
                "type": "array",
                "maxItems": 3,
                "items": {
                  "$ref": "#/components/schemas/Clarification"
                }
              },
              {
                "type": "null"
              }
            ]
          },
          "final_review_completed": {
            "type": "boolean"
          },
          "review_stage": {
            "type": "string"
          },
          "review_stage_label": {
            "type": "string"
          },
          "estimate_basis": {
            "type": [
              "string",
              "null"
            ]
          },
          "stage_elapsed_seconds": {
            "type": [
              "integer",
              "null"
            ]
          },
          "worker_heartbeat_age_seconds": {
            "type": [
              "integer",
              "null"
            ]
          },
          "estimate_exceeded": {
            "type": "boolean"
          },
          "worker_status_uncertain": {
            "type": "boolean"
          },
          "wait_guidance": {
            "type": "string"
          },
          "estimated_stage_seconds": {
            "anyOf": [
              {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "low": {
                    "type": "integer"
                  },
                  "high": {
                    "type": "integer"
                  }
                },
                "required": [
                  "low",
                  "high"
                ]
              },
              {
                "type": "null"
              }
            ]
          },
          "estimated_remaining_seconds": {
            "anyOf": [
              {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "low": {
                    "type": "integer"
                  },
                  "high": {
                    "type": "integer"
                  }
                },
                "required": [
                  "low",
                  "high"
                ]
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "schema",
          "review_id",
          "status",
          "round",
          "duplicate",
          "recommended_check_after_seconds",
          "clarification",
          "error",
          "review_summary",
          "source_review_status"
        ]
      },
      "Submission": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "research_use_consented": {
            "type": "boolean",
            "const": true
          },
          "review_id": {
            "type": "string",
            "pattern": "^R-[a-f0-9]{32}$"
          },
          "primary_record": {
            "type": "object",
            "additionalProperties": true,
            "description": "Exact frozen primary source, plus participant_review.summary_shown=true and confirmed=true."
          },
          "cf003_record": {
            "type": "object",
            "additionalProperties": true,
            "description": "Separate frozen three-question CF-003 record linked to this exact primary."
          }
        },
        "required": [
          "research_use_consented",
          "review_id",
          "primary_record",
          "cf003_record"
        ]
      },
      "Receipt": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "schema": {
            "type": "string",
            "const": "life-patterns-gpt-submission-receipt-v1"
          },
          "submission_id": {
            "type": "string"
          },
          "received_at_utc": {
            "type": "string"
          },
          "duplicate": {
            "type": "boolean"
          },
          "review_id": {
            "type": "string",
            "pattern": "^R-[a-f0-9]{32}$"
          },
          "primary_record_sha256": {
            "type": "string"
          },
          "cf003_record_sha256": {
            "type": "string"
          },
          "stored_encrypted": {
            "type": "boolean"
          },
          "independent_review_completed": {
            "type": "boolean"
          },
          "inference_started": {
            "type": "boolean"
          }
        },
        "required": [
          "schema",
          "submission_id",
          "received_at_utc",
          "duplicate",
          "review_id",
          "primary_record_sha256",
          "cf003_record_sha256",
          "stored_encrypted",
          "independent_review_completed",
          "inference_started"
        ]
      },
      "BatchAnswer": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "clarification_id": {
            "type": "string",
            "pattern": "^Q-[a-f0-9]{32}$"
          },
          "answer_text": {
            "type": "string",
            "maxLength": 20000
          },
          "skipped": {
            "type": "boolean"
          }
        },
        "required": [
          "clarification_id",
          "answer_text",
          "skipped"
        ]
      },
      "ClarificationBatchAnswers": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "batch_id": {
            "type": "string",
            "pattern": "^B-[a-f0-9]{32}$"
          },
          "operation_id": {
            "type": "string",
            "minLength": 16,
            "maxLength": 80,
            "pattern": "^[a-zA-Z0-9_-]+$",
            "description": "Random per-operation identifier. Reuse the exact identifier and body when retrying."
          },
          "answers": {
            "type": "array",
            "minItems": 1,
            "maxItems": 3,
            "items": {
              "$ref": "#/components/schemas/BatchAnswer"
            }
          }
        },
        "required": [
          "batch_id",
          "operation_id",
          "answers"
        ]
      }
    }
  }
}
