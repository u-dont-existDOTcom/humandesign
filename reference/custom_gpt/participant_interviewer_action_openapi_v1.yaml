openapi: 3.1.0
info:
  title: AstroHD Blind Interview Actions
  version: 1.0.0
  description: >-
    Interview-only actions for a natal AstroHD session already created by the
    trusted same-origin intake. These actions never accept birth data and do not
    expose the frozen chart or true rank before confirmatory lock.
servers:
  - url: https://YOUR_API_HOST
paths:
  /v1/interviewer/progress:
    post:
      operationId: getParticipantProgress
      summary: Get participant-safe progress
      description: >-
        Returns coverage and candidate discrimination but never the concealed
        true birth-state/date rank.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionAccess'
      responses:
        '200':
          description: Participant-safe progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
  /v1/interviewer/next-question:
    post:
      operationId: getParticipantNextQuestion
      summary: Select the next neutral interview question
      description: >-
        Uses candidate-blind discrimination to suggest an informative frozen
        dimension and its minimum-evidence requirement. Other/free-form responses
        must always remain available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionAccess'
      responses:
        '200':
          description: Suggested question or open-narrative guidance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextQuestionResponse'
  /v1/interviewer/evidence:
    post:
      operationId: appendParticipantEvidence
      summary: Append one atomic participant observation
      description: >-
        Only trait/behavior observations with an honestly matching frozen answer
        token can affect natal ranking. Use answer=null for unmatched free text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceAccess'
      responses:
        '200':
          description: Immutable appended evidence record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string}
                  session_id: {type: string}
                additionalProperties: true
  /v1/interviewer/lock:
    post:
      operationId: lockParticipantConfirmatoryEvidence
      summary: Lock pre-reveal confirmatory evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionAccess'
      responses:
        '200':
          description: Confirmatory evidence-lock metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string}
                  session_id: {type: string}
                additionalProperties: true
  /v1/interviewer/reveal:
    post:
      operationId: revealParticipantResult
      summary: Reveal frozen predictions and confirmatory rank
      description: >-
        Available only after lock. Returns confirmatory ranks and dimension-level
        comparisons to predictions frozen before answers. Exact birth data and the
        raw chart remain on the trusted AstroHD result page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionAccess'
      responses:
        '200':
          description: Confirmatory reveal report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string}
                  session_id: {type: string}
                additionalProperties: true
  /v1/interviewer/finalize-exploratory:
    post:
      operationId: finalizeParticipantExploratoryProfile
      summary: Finalize the post-reveal exploratory profile
      description: >-
        Produces a separately labeled post-hoc ranking and never overwrites the
        confirmatory result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionAccess'
      responses:
        '200':
          description: Confirmatory and exploratory results side by side.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string}
                  session_id: {type: string}
                additionalProperties: true
  /v1/interviewer/final-report:
    post:
      operationId: getParticipantFinalReport
      summary: Fetch the completed participant report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionAccess'
      responses:
        '200':
          description: Completed confirmatory plus exploratory report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string}
                  session_id: {type: string}
                additionalProperties: true
components:
  schemas:
    ProgressResponse:
      type: object
      additionalProperties: true
      required:
        - schema_version
        - session_id
        - phase
        - required_confirmatory_question_count
        - adequately_assessed_question_count
        - adequately_assessed_coverage
        - unresolved_question_count
        - true_birth_rank_concealed
      properties:
        schema_version: {type: string, const: participant-progress-v2}
        session_id: {type: string}
        phase:
          type: string
          enum:
            - confirmatory_blind
            - confirmatory_locked
            - revealed
            - posthoc_exploratory
            - finalized
        confirmatory_observation_count: {type: integer, minimum: 0}
        scoreable_observation_count: {type: integer, minimum: 0}
        non_natal_observation_count: {type: integer, minimum: 0}
        scoreable_question_count: {type: integer, minimum: 0}
        scoreable_coverage: {type: number, minimum: 0, maximum: 1}
        required_confirmatory_question_count: {type: integer, minimum: 0}
        adequately_assessed_question_count: {type: integer, minimum: 0}
        adequately_assessed_coverage:
          type: number
          minimum: 0
          maximum: 1
          description: Must equal 1.0 before requesting the confirmatory lock.
        unresolved_question_count: {type: integer, minimum: 0}
        candidate_state_count: {type: [integer, 'null'], minimum: 1}
        top_state_tie_count: {type: [integer, 'null'], minimum: 1}
        top_margin_rubric_bits: {type: [number, 'null']}
        true_birth_rank_concealed: {type: boolean, const: true}
    NextQuestionResponse:
      type: object
      additionalProperties: true
      required:
        - schema_version
        - session_id
        - question_id
        - prompt
        - response_format
        - minimum_evidence
        - followups
        - allow_other
        - guidance
      properties:
        schema_version: {type: string, const: participant-next-question-v2}
        session_id: {type: string}
        question_id: {type: [string, 'null']}
        prompt: {type: string}
        response_format: {type: string}
        minimum_evidence:
          type: string
          description: The evidence that must be acquired before this dimension can pass.
        followups: {type: array, items: {type: string}}
        expected_information_gain: {type: [number, 'null']}
        adjusted_utility: {type: [number, 'null']}
        allow_other: {type: boolean, const: true}
        guidance: {type: string}
    SessionAccess:
      type: object
      additionalProperties: false
      required: [session_id, session_token]
      properties:
        session_id:
          type: string
          pattern: '^HD-[A-F0-9]{32}$'
          description: The opaque session ID shown by trusted intake.
        session_token:
          type: string
          minLength: 32
          writeOnly: true
          description: >-
            The separate private token shown once by trusted intake. Send it only
            in this request body and never place it in a URL.
    EvidenceAccess:
      type: object
      additionalProperties: false
      required: [session_id, session_token, evidence]
      properties:
        session_id:
          type: string
          pattern: '^HD-[A-F0-9]{32}$'
          description: The opaque session ID shown by trusted intake.
        session_token:
          type: string
          minLength: 32
          writeOnly: true
          description: >-
            The separate private token shown once by trusted intake. Send it only
            in this request body and never place it in a URL.
        evidence:
          $ref: '#/components/schemas/EvidenceInput'
    EvidenceInput:
      type: object
      additionalProperties: false
      required: [domain, narrative]
      properties:
        domain:
          type: string
          enum: [trait, behavior, outcome, timing, environment, conventional_covariate]
        question_id: {type: [string, 'null'], default: null}
        cluster_id: {type: [string, 'null'], default: null}
        answer:
          type: [string, 'null']
          default: null
          description: >-
            A frozen response token only when it genuinely fits. Null preserves
            free text without forcing a scoring category.
        behavioral_confidence: {type: number, minimum: 0, maximum: 1, default: 0.5}
        measurement_reliability: {type: number, minimum: 0, maximum: 1, default: 0.75}
        narrative: {type: string, minLength: 1}
        childhood_pattern: {type: [string, 'null'], default: null}
        adult_pattern: {type: [string, 'null'], default: null}
        contexts: {type: array, items: {type: string}, default: []}
        exceptions: {type: array, items: {type: string}, default: []}
        example_text: {type: [string, 'null'], default: null}
        counterexample_text: {type: [string, 'null'], default: null}
        minimum_evidence_passed:
          type: boolean
          default: false
          description: >-
            True only when the current question's returned minimum-evidence
            requirement has actually been met.
        consistency_status:
          type: string
          enum: [not_checked, consistent, reconciled, unresolved]
          default: not_checked
          description: >-
            Whether this observation agrees with prior evidence, was reconciled by
            context or life-stage change, or remains unresolved.
        quality_rationale:
          type: [string, 'null']
          default: null
          description: >-
            Short evidence-specific reason for passing the minimum and consistency
            gates. Required by the server for adequate trait/behavior evidence.
        supersedes_evidence_id: {type: [string, 'null'], default: null}
