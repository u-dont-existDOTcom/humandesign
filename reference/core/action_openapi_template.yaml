openapi: 3.1.0
info:
  title: Human Design Reverse-Matching Search API
  version: 0.1.0
  description: >-
    Deterministic candidate-blind chart calculation and search service.
    Replace the placeholder server URL and implement the endpoints before use.
servers:
  - url: https://YOUR-BACKEND.example.com
paths:
  /v1/runs:
    post:
      operationId: createRun
      summary: Create an auditable reverse-matching run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '200':
          description: Run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
  /v1/runs/{run_id}/profile:
    post:
      operationId: uploadFrozenProfile
      summary: Upload and verify a frozen behavioral profile
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profile accepted
  /v1/runs/{run_id}/candidates:
    post:
      operationId: uploadCandidates
      summary: Upload bounded candidate tuples
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_pool_sha256, candidates]
              properties:
                candidate_pool_sha256:
                  type: string
                candidates:
                  type: array
                  items:
                    $ref: '#/components/schemas/Candidate'
      responses:
        '200':
          description: Candidates accepted and independently resolved
  /v1/runs/{run_id}/search/bounded:
    post:
      operationId: runBoundedSearch
      summary: Score every bounded candidate on frozen discovery evidence
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Search completed
  /v1/runs/{run_id}/search/global:
    post:
      operationId: runGlobalSearch
      summary: Search exact chart-state intervals in a UTC range
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalSearchRequest'
      responses:
        '200':
          description: Global search completed
  /v1/runs/{run_id}/opaque-results:
    get:
      operationId: getOpaqueResults
      summary: Get rankings without birth data or chart labels
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Opaque ranking
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpaqueResult'
  /v1/runs/{run_id}/differences:
    get:
      operationId: getOpaqueDifferences
      summary: Get neutral finalist partitions for active question selection
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Candidate-blind differences
  /v1/runs/{run_id}/answers:
    post:
      operationId: appendFrozenAnswersAndRerun
      summary: Append a frozen answer batch and rerun the full universe
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: New profile version scored
  /v1/runs/{run_id}/freeze-finalists:
    post:
      operationId: freezeFinalists
      summary: Freeze discovery finalists before holdout reveal
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Finalists frozen
  /v1/runs/{run_id}/reveal-holdout:
    post:
      operationId: revealHoldout
      summary: Score concealed holdout after finalist freeze
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Holdout scored
  /v1/runs/{run_id}/robustness:
    post:
      operationId: runRobustness
      summary: Run perturbation, ablation, mapping, and time sensitivity
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Robustness completed
  /v1/runs/{run_id}/final-report:
    get:
      operationId: getFinalReport
      summary: Get final report, optionally revealing birth tuples
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: reveal
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Final report
components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    CreateRunRequest:
      type: object
      required:
        - search_mode
        - candidate_universe_sha256
        - profile_sha256
        - question_bank_version
        - mapping_library_version
        - scoring_model_version
        - holdout_seed
      properties:
        search_mode:
          type: string
          enum: [bounded, blinded_1000, known_date_rectification, global_utc, combined]
        candidate_universe_sha256:
          type: string
        profile_sha256:
          type: string
        question_bank_version:
          type: string
        mapping_library_version:
          type: string
        scoring_model_version:
          type: string
        holdout_seed:
          type: integer
    Run:
      type: object
      properties:
        run_id:
          type: string
        status:
          type: string
        engine_manifest:
          type: object
    Candidate:
      type: object
      required: [candidate_id, local_date, local_time, timezone]
      properties:
        candidate_id:
          type: string
        local_date:
          type: string
          format: date
        local_time:
          type: string
        timezone:
          type: string
        fold:
          type: integer
          enum: [0, 1]
        supplied_utc_timestamp:
          type: string
          format: date-time
    GlobalSearchRequest:
      type: object
      required: [range_start_utc, range_end_utc, feature_layers]
      properties:
        range_start_utc:
          type: string
          format: date-time
        range_end_utc:
          type: string
          format: date-time
        feature_layers:
          type: array
          items:
            type: string
            enum: [architecture, gate_line, substructure]
        boundary_tolerance_seconds:
          type: number
          minimum: 0.001
    OpaqueResult:
      type: object
      properties:
        candidate_id:
          type: string
        discovery_rank:
          type: integer
        core_fit:
          type: number
        detailed_support:
          type: number
        evidence_bits:
          type: number
        contradiction_bits:
          type: number
        net_bits:
          type: number
        stable_interval_id:
          type: string
        boundary_status:
          type: string
