[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hdmatch"
version = "0.1.0"
description = "Blinded Human Design birth-moment reverse-matching research harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
ephemeris = ["pyswisseph>=2.10.3.2,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
empirical = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<24",
  "scikit-learn>=1.6,<2",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12.20241230",
]
all = [
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<24",
  "pyswisseph>=2.10.3.2,<3",
  "scikit-learn>=1.6,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
hdmatch = "hdmatch.cli:main"

[tool.hatch.build]
include = [
  "src/hdmatch/**/*.py",
  "src/hdmatch/py.typed",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hdmatch"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hdmatch"]
