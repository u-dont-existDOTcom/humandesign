name: Partner 1000 null benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/partner_null_1000.py'
      - 'reference/research/partner_null_1000_freeze_v1.md'
      - 'scripts/partner_future_pilot.py'
      - 'scripts/partner_hd_timing_pilot.py'
      - 'scripts/fetch_swisseph_ephemeris.py'
      - '.github/workflows/partner-null-1000.yml'

permissions:
  contents: write

jobs:
  null-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PySwissEph
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3'
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Run frozen 1000-partner null benchmark
        run: python scripts/partner_null_1000.py
      - name: Commit null result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/partner_null_1000_results_v1.json
          if git diff --cached --quiet; then
            echo "Null result unchanged"
          else
            git commit -m "Record partner 1000 null benchmark v1"
            git push
          fi
