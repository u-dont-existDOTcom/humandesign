name: ADB pair timing model discovery V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/adb_pair_timing_model_discovery_v2.py'
      - 'reference/research/adb_pair_timing_model_discovery_freeze_v2.md'
      - '.github/workflows/adb-pair-timing-model-discovery-v2.yml'

permissions:
  contents: write

jobs:
  model-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3' numpy scikit-learn
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Run frozen high-resolution model discovery
        run: python scripts/adb_pair_timing_model_discovery_v2.py
      - name: Commit model-discovery result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_pair_timing_model_discovery_results_v2.json
          if git diff --cached --quiet; then
            echo "Model-discovery result unchanged"
          else
            git commit -m "Record high-resolution pair timing discovery v2"
            git pull --rebase origin main
            git push
          fi
