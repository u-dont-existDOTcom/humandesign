name: ADB exact-pair timing V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/adb_exact_pair_timing_v3.py'
      - 'scripts/adb_exact_pair_timing_v3_runner.py'
      - 'reference/research/adb_exact_pair_timing_freeze_v3.md'
      - '.github/workflows/adb-exact-pair-timing-v3.yml'

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3' numpy scikit-learn
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Run frozen exact-pair timing V3
        run: python scripts/adb_exact_pair_timing_v3_runner.py
      - name: Commit V3 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_exact_pair_timing_results_v3.json
          if git diff --cached --quiet; then
            echo "V3 result unchanged"
          else
            git commit -m "Record exact-pair timing V3 result"
            git pull --rebase origin main
            git push
          fi
