name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and verification dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Unit and integration tests
        run: python -m pytest
      - name: Lint production code and tests
        # Legacy research scripts are not a Ruff-clean baseline and include
        # runner-patched source artifacts. Keep the application quality gate
        # strict on substantive rules without making line wrapping/import order
        # a merge blocker for this pilot.
        run: ruff check src tests --ignore E501,I001
      - name: Type check
        run: mypy src/hdmatch

  survey-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install deterministic test dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          npm --prefix tests/browser ci
      - name: Test actual browser workflow against synthetic loopback fixture
        run: |
          PYTHONPATH=src:tests/browser python -m uvicorn fixture_server:app --host 127.0.0.1 --port 18765 --log-level warning &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          python - <<'PYREADY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18765/healthz', timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('Synthetic fixture did not become ready')
          PYREADY
          npm --prefix tests/browser test

  castille-synastry-once:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'Run Castille synastry via CI') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install large-N test dependencies
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3' numpy scikit-learn
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Run frozen Castille static synastry V1
        run: python scripts/castille_static_synastry_v1.py
      - name: Commit aggregate result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/castille_static_synastry_results_v1.json
          git commit -m "Record Castille static synastry V1 result"
          git pull --rebase origin main
          git push
