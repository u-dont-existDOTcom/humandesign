name: Castille wedding timing V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/castille_wedding_timing_v1.py'
      - 'scripts/castille_wedding_timing_v1_runner.py'
      - 'reference/research/castille_wedding_timing_freeze_v1.md'
      - '.github/workflows/castille-wedding-timing-v1.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3' numpy scikit-learn
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Run frozen large-N Castille wedding timing test
        run: python scripts/castille_wedding_timing_v1_runner.py
      - name: Commit aggregate result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/castille_wedding_timing_results_v1.json
          if git diff --cached --quiet; then
            echo "Castille wedding timing result unchanged"
          else
            git commit -m "Record Castille wedding timing V1 result"
            git pull --rebase origin main
            git push
          fi
