name: Correct dissolution feature registry V1 hash

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/correct_dissolution_feature_registry_v1_hash.py'
      - '.github/workflows/correct-dissolution-feature-registry-v1-hash.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct frozen pre-feature ephemeris hash transcription
        run: python scripts/correct_dissolution_feature_registry_v1_hash.py
      - name: Commit corrected registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_broad_exact_pair_dissolution_feature_registry_v1.json
          if git diff --cached --quiet; then
            echo "Registry already corrected"
          else
            git commit -m "Correct frozen dissolution registry ephemeris hash before features"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
