name: Build AstroHD ephemeris cache
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_astrohd_ephemeris_cache.py
      - scripts/fetch_swisseph_ephemeris.py
      - .github/workflows/build_astrohd_ephemeris_cache.yml
permissions:
  contents: write
jobs:
  build-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy pyswisseph
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Build fail-closed SWIEPH cache
        run: python scripts/build_astrohd_ephemeris_cache.py --out data/ephemeris/astrohd_generic_v2_swieph
      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ephemeris/astrohd_generic_v2_swieph
          if git diff --cached --quiet; then
            echo "Cache unchanged"
          else
            git commit -m "Cache AstroHD 1926-2026 SWIEPH ephemeris"
            git push
          fi
