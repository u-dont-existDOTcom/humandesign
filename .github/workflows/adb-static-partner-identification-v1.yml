name: ADB static partner identification V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/adb_static_partner_identification_v1.py'
      - 'reference/research/adb_static_partner_identification_freeze_v1.md'
      - '.github/workflows/adb-static-partner-identification-v1.yml'

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3' numpy scikit-learn
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Run static partner identification benchmark
        run: python scripts/adb_static_partner_identification_v1.py
      - name: Commit benchmark result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_static_partner_identification_results_v1.json
          if git diff --cached --quiet; then
            echo "Static partner result unchanged"
          else
            git commit -m "Record static partner identification v1"
            git pull --rebase origin main
            git push
          fi

# Workflow-only trigger edit; frozen benchmark specification is unchanged.
