name: build-century-candidate-cache

on:
  push:
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC start
        required: true
        default: "1926-08-22T00:00:00Z"
      end_exclusive:
        description: Exclusive UTC end
        required: true
        default: "2026-08-23T00:00:00Z"

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Build exact century cache via CI')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact chart dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Build and verify exact century candidate cache
        run: |
          START='${{ inputs.start }}'
          END='${{ inputs.end_exclusive }}'
          if [ -z "$START" ]; then START='1926-08-22T00:00:00Z'; fi
          if [ -z "$END" ]; then END='2026-08-23T00:00:00Z'; fi
          python scripts/build_century_candidate_cache.py \
            --ephemeris data/ephemeris \
            --output century-candidate-cache \
            --start "$START" \
            --end-exclusive "$END" \
            --generation-commit '${{ github.sha }}'
      - name: Upload verified century cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: century-candidate-cache-${{ github.sha }}
          path: century-candidate-cache
          if-no-files-found: error
          retention-days: 30
