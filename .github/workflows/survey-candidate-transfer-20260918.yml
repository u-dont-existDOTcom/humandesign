name: Exact Sol survey candidate transfer
on:
  push:
    branches: [chat/survey-sol-xhigh-20260918-0033]
    paths: [.github/workflows/survey-candidate-transfer-20260918.yml]
permissions:
  contents: read
concurrency:
  group: exact-sol-survey-transfer-20260918
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'u-dont-existDOTcom/humandesign' && github.ref == 'refs/heads/chat/survey-sol-xhigh-20260918-0033'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Recover checksum-pinned candidate without executing its code
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          shas = [
            '68d596e7eace40e9c6f8cf1d7c641a02f739988a',
            'dcb07ec11921068209f7ae98aa6473d20734447a',
            '9a0cd309077fbcfdb477a5ca1b5c943c5be66d4d',
            '71ceaf208a3a42714120a0a7d1ee8d93c56065be',
            '10fd623a2e37192e40f4b5aa13c170cfffac2419',
            '5e9b3ae29eb70a001ce5425133cfbbcf94d49921',
            '781e06a06a1c776701d315da8fc18a5de17e0f32',
            '5f572fd59d5c9e2c997f511c8118a1bd55a99b7b',
            '25544ed4ebe8727ca397e9462f8efa4386f45419',
            'aec993ddbb4656b4aa07c6187735d73f1cfe0ddb',
          ]
          parts = []
          for sha in shas:
              record = json.loads(subprocess.check_output(['gh', 'api', 'repos/u-dont-existDOTcom/humandesign/git/blobs/' + sha]))
              data = base64.b64decode(record['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              parts.append(data)
          compressed = b''.join(parts)
          assert hashlib.sha256(compressed).hexdigest() == '2f76392fae87b837f0f9eea8baf2dbd628f41dde929aa6517b715cd380a1c475'
          bundle = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-survey.bundle'
          bundle.write_bytes(lzma.decompress(compressed))
          subprocess.run(['git', 'bundle', 'verify', str(bundle)], check=True)
          subprocess.run(['git', 'fetch', str(bundle), 'HEAD'], check=True)
          candidate = subprocess.check_output(['git', 'rev-parse', 'FETCH_HEAD'], text=True).strip()
          assert candidate == '91a642be70296267087d3e42d3301d9ca3a64551'
          tree = subprocess.check_output(['git', 'rev-parse', candidate + '^{tree}'], text=True).strip()
          assert tree == '6fa2cffa8475433163925dfa66a7d05946a6bf13'
          branch = 'refs/heads/chat/survey-sol-xhigh-20260918-0033'
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', branch], text=True).split()[0]
          assert remote == os.environ['TRIGGER_SHA'], 'Writer advanced; reconcile instead of overwriting.'
          env = dict(os.environ, GIT_AUTHOR_NAME='ChatGPT', GIT_AUTHOR_EMAIL='chatgpt@users.noreply.github.com', GIT_COMMITTER_NAME='ChatGPT', GIT_COMMITTER_EMAIL='chatgpt@users.noreply.github.com')
          message = 'Implement owner-selected Sol xhigh and repair-first survey dialogue\n\nExact locally verified candidate tree. Temporary transport workflow removed.\n'
          new = subprocess.check_output(['git', 'commit-tree', tree, '-p', os.environ['TRIGGER_SHA']], input=message, text=True, env=env).strip()
          subprocess.run(['git', 'push', 'origin', new + ':' + branch], check=True)
          print('PUBLISHED_COMMIT', new)
          print('VERIFIED_TREE', tree)
          print('No application code, model inference, or participant data executed by this transport.')
          PY
