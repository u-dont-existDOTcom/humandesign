name: smoke-iau-constellation

on:
  push:
  workflow_dispatch:

# Version-pinned integration of actual IAU-88/Delporte constellation membership.
# Canonical display names are normalized from the IAU abbreviation identity.
permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Smoke IAU constellation via CI')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install 'astropy==8.0.1'
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Resolve actual IAU constellations
        run: |
          python scripts/smoke_iau_constellation_projection.py \
            --ephemeris data/ephemeris \
            --astropy-version '8.0.1' \
            --output iau-constellation-smoke.json
      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iau-constellation-smoke-${{ github.sha }}
          path: iau-constellation-smoke.json
          if-no-files-found: error
          retention-days: 30