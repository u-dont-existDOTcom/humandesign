name: ADB exact-pair state-history recovery V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/adb_exact_pair_state_history_recovery_v1.py'
      - 'reference/research/adb_exact_pair_state_history_recovery_freeze_v1.md'
      - 'reference/research/adb_external_eventlinked_exact_recovery_v1.json'
      - 'scripts/adb_exact_pair_timing_v3.py'
      - 'scripts/adb_exact_pair_timing_v3_runner.py'
      - '.github/workflows/adb-exact-pair-state-history-recovery-v1.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies needed to reconstruct the frozen V3 pair universe
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3' numpy scikit-learn
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Recover structured pair state histories
        run: python scripts/adb_exact_pair_state_history_recovery_v1.py
      - name: Commit compact state-history recovery result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_exact_pair_state_history_recovery_v1.json
          if git diff --cached --quiet; then
            echo "State-history recovery result unchanged"
          else
            git commit -m "Record exact-pair ADB state-history recovery v1"
            git pull --rebase origin main
            git push
          fi
