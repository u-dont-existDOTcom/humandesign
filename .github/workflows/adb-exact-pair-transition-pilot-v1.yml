name: ADB exact-time pair transition pilot V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/adb_exact_pair_transition_pilot_v1.py'
      - 'reference/research/adb_exact_pair_transition_pilot_freeze_v1.md'
      - '.github/workflows/adb-exact-pair-transition-pilot-v1.yml'

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3' numpy scikit-learn
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Run exact-time transition pilot
        run: python scripts/adb_exact_pair_transition_pilot_v1.py
      - name: Commit aggregate pilot result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_exact_pair_transition_pilot_results_v1.json
          if git diff --cached --quiet; then
            echo "Exact-time pilot unchanged"
          else
            git commit -m "Record exact-time pair transition pilot v1"
            git pull --rebase origin main
            git push
          fi
