name: V4.3 profile NetInformation audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'reference/core/behavioral_target_combined_v3_6.md'
      - 'reference/core/profile_v3_6_v43_mapping_frozen_2026_08_22.json'
      - 'scripts/v43_profile_netinfo_rerun.py'
      - 'scripts/swieph_ab_rerun.py'
      - 'scripts/fetch_swisseph_ephemeris.py'
      - '.github/workflows/v43-profile-netinfo-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PySwissEph
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3'
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Run frozen 100-year NetInformation-first audit
        env:
          EPHE_PATH: data/ephemeris
          HD_START: '1926-08-22T05:40:00+00:00'
          HD_END: '2026-08-22T05:40:00+00:00'
          HD_MAPPING: 'reference/core/profile_v3_6_v43_mapping_frozen_2026_08_22.json'
          HD_TARGET: 'reference/core/behavioral_target_combined_v3_6.md'
        run: python scripts/v43_profile_netinfo_rerun.py
