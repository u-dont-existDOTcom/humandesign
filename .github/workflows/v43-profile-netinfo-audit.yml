name: V4.3 historical audit cache-first guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'reference/core/behavioral_target_combined_v3_6.md'
      - 'reference/core/profile_v3_6_v43_mapping_frozen_2026_08_22.json'
      - 'reference/core/profile_v3_6_v43_mapping_overlay_v2_2026_08_22.json'
      - 'scripts/v43_profile_netinfo_rerun.py'
      - 'scripts/v43_profile_netinfo_rerun_v2.py'
      - 'scripts/swieph_ab_rerun.py'
      - 'scripts/fetch_swisseph_ephemeris.py'
      - '.github/workflows/v43-profile-netinfo-audit.yml'

permissions:
  contents: read

jobs:
  cache-first-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce reusable-cache migration order
        run: |
          echo "The 2026-08-22 V3.6 audit is a frozen historical development result."
          echo "Its direct century runner is disabled on this integration branch."
          echo "A new broad ranking may run only from the verified reusable century cache after Phases 0-3 pass."
