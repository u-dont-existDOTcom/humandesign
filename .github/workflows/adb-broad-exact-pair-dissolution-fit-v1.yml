name: ADB broad exact-pair dissolution fit V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/adb_broad_exact_pair_dissolution_fit_v1.py'
      - 'reference/research/adb_broad_exact_pair_dissolution_semimarkov_freeze_v1.md'
      - 'reference/research/adb_broad_exact_pair_dissolution_feature_registry_v1.json'
      - 'reference/research/adb_broad_exact_pair_dissolution_design_matrix_policy_v1.json'
      - 'reference/research/adb_broad_exact_pair_dissolution_episode_readiness_v1.json'
      - '.github/workflows/adb-broad-exact-pair-dissolution-fit-v1.yml'

permissions:
  contents: write

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3' numpy scikit-learn
      - name: Fetch pinned Swiss ephemeris
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Run frozen dissolution V1 fit
        run: python scripts/adb_broad_exact_pair_dissolution_fit_v1.py
      - name: Commit frozen feature matrix and development fit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_broad_exact_pair_dissolution_feature_matrix_v1.json reference/research/adb_broad_exact_pair_dissolution_fit_results_v1.json
          if git diff --cached --quiet; then
            echo "Fit artifacts unchanged"
          else
            git commit -m "Record broad exact-pair dissolution V1 fit"
            git pull --rebase origin main
            git push
          fi
