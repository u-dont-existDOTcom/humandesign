name: audit-de440s-astropy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Run independent DE440s audit via CI')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install 'astropy>=8.0,<8.1' 'jplephem>=2.22,<3'
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Fetch official JPL DE440s kernel
        run: |
          curl --fail --location --retry 3 \
            --output de440s.bsp \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
      - name: Run independent astronomy audit
        # The script sets both ecliptic equinox and observation time to each
        # sampled instant so the geocentric transform does not default to J2000.
        run: |
          python scripts/audit_de440s_astropy.py \
            --swiss-file data/ephemeris/sepl_18.se1 \
            --swiss-file data/ephemeris/semo_18.se1 \
            --de440s de440s.bsp \
            --output de440s-astropy-audit.json
      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: de440s-astropy-audit-${{ github.sha }}
          path: de440s-astropy-audit.json
          if-no-files-found: error
          retention-days: 30
