name: one-shot-fix-holistic

on:
  push:
    branches:
      - codex/harness-integration

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Apply holistic Ruff fix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/harness-integration
      - name: Apply exact fix and self-delete
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/hdmatch/human/holistic.py')
          s = p.read_text()
          old = 'f"{seed}:{participant_id}".encode("utf-8")'
          new = 'f"{seed}:{participant_id}".encode()'
          if old not in s:
              raise SystemExit('expected Ruff target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/one-shot-fix-holistic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/hdmatch/human/holistic.py .github/workflows/one-shot-fix-holistic.yml
          git commit -m 'Apply holistic Ruff fix'
          git push origin HEAD:codex/harness-integration
