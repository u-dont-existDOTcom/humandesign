name: audit-century-discrimination

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Audit century discrimination via CI')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Download durable verified century cache release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p century-artifact
          gh release download century-cache-structural-v2-1926-2026 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'century-candidate-cache-structural-v2-1926-2026.tar.gz' \
            --dir .
          tar -xzf century-candidate-cache-structural-v2-1926-2026.tar.gz -C century-artifact
          test -f century-artifact/manifest.json
      - name: Audit real century universe
        run: |
          python scripts/audit_century_discrimination.py \
            --cache century-artifact \
            --mapping-library mappings/mapping_library_v1.json \
            --output state/CENTURY-DISCRIMINATION-AUDIT.json
      - name: Upload immutable report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: century-discrimination-audit-${{ github.sha }}
          path: state/CENTURY-DISCRIMINATION-AUDIT.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit report to audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/CENTURY-DISCRIMINATION-AUDIT.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'data: record century discrimination audit'
          git push origin HEAD:${{ github.ref_name }}
