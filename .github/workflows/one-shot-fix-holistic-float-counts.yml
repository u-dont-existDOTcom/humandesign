name: one-shot-fix-holistic-float-counts

on:
  push:
    branches:
      - codex/harness-integration

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Use float-valued holistic count stores' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/harness-integration
      - name: Patch typing without changing algorithm
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/hdmatch/human/holistic.py')
          s = p.read_text()
          replacements = {
              'from collections import Counter, defaultdict': 'from collections import defaultdict',
              'background: dict[str, Counter[str]] = {feature: Counter() for feature in features}': 'background: dict[str, dict[str, float]] = {\n            feature: defaultdict(float) for feature in features\n        }',
              'raw_label_counts: Counter[str] = Counter()': 'raw_label_counts: dict[str, float] = defaultdict(float)',
              'raw_label_feature: dict[str, dict[str, Counter[str]]] = defaultdict(\n            lambda: {feature: Counter() for feature in features}\n        )': 'raw_label_feature: dict[str, dict[str, dict[str, float]]] = defaultdict(\n            lambda: {feature: defaultdict(float) for feature in features}\n        )',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected text not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/one-shot-fix-holistic-float-counts.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/hdmatch/human/holistic.py .github/workflows/one-shot-fix-holistic-float-counts.yml
          git commit -m 'Use float-valued holistic count stores'
          git push origin HEAD:codex/harness-integration
