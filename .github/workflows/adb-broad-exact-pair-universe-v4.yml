name: ADB broad exact-pair universe V4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/adb_broad_exact_pair_universe_v4.py'
      - 'reference/research/adb_broad_exact_pair_universe_freeze_v4.md'
      - '.github/workflows/adb-broad-exact-pair-universe-v4.yml'

permissions:
  contents: write

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3' numpy scikit-learn
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Build frozen outcome-independent exact-pair universe
        run: python scripts/adb_broad_exact_pair_universe_v4.py
      - name: Commit compact universe audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_broad_exact_pair_universe_v4.json
          if git diff --cached --quiet; then
            echo "V4 universe result unchanged"
          else
            git commit -m "Record broad exact-pair universe V4"
            git pull --rebase origin main
            git push
          fi
