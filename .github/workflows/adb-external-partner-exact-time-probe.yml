name: ADB external partner exact-time probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/adb_external_partner_exact_time_probe.py'
      - '.github/workflows/adb-external-partner-exact-time-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe external partner timed records
        run: python scripts/adb_external_partner_exact_time_probe.py
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_external_partner_exact_time_probe_v1.json
          if git diff --cached --quiet; then
            echo "Probe result unchanged"
          else
            git commit -m "Record ADB external partner exact-time probe"
            git pull --rebase origin main
            git push
          fi
