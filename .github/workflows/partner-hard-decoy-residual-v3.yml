name: Partner hard-decoy residual V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/partner_hard_decoy_residual_v3.py'
      - 'reference/research/partner_hard_decoy_residual_freeze_v3.md'
      - 'scripts/partner_multidomain_1000_v2.py'
      - 'scripts/partner_future_pilot.py'
      - 'scripts/partner_hd_timing_pilot.py'
      - 'scripts/fetch_swisseph_ephemeris.py'
      - '.github/workflows/partner-hard-decoy-residual-v3.yml'

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PySwissEph
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3'
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Run frozen hard-decoy residual benchmark V3
        run: python scripts/partner_hard_decoy_residual_v3.py
      - name: Commit V3 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/partner_hard_decoy_residual_results_v3.json
          if git diff --cached --quiet; then
            echo "V3 result unchanged"
          else
            git commit -m "Record hard-decoy partner residual V3 result"
            git push
          fi
