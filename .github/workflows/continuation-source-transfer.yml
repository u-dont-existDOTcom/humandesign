name: Exact survey continuation transfer
on:
  push:
    branches: [chat/repair-paraphrase-frontier-20260918-1931]
    paths: [.github/workflows/continuation-source-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    if: contains(github.event.head_commit.message, 'Transfer exact locally verified survey continuation candidate')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
      - name: Verify and install exact survey diff on isolated writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 69429453e1dda94eaaff947ae9deb132d6237ced
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          parts = ['3bd73d5dd485f4fc1da81df6b69b0eb24c2f65a0', '7edbd75f78c555fc2c4c90d1d0aefb0fd15ac9ca', 'c47d90ed152300504f155cc07fd5ea1171d9fdf9', '74fac7ae2fdf317af7797229dbac439d80519424', '63270933bcfd845c2aa5c35ff37d0b3d10b14632', '3a6b171656ce8a65ad63d6496bcde9ad51cb9c74']
          body = b''
          for sha in parts:
              req = urllib.request.Request('https://api.github.com/repos/u-dont-existDOTcom/humandesign/git/blobs/'+sha, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              item = json.load(urllib.request.urlopen(req, timeout=20))
              part = base64.b64decode(item['content'])
              assert hashlib.sha1(b'blob '+str(len(part)).encode()+b'\0'+part).hexdigest() == sha
              body += part
          assert hashlib.sha256(body).hexdigest() == 'f9967b10e527ed35b83f368d9407be80d4939b2e8d8854577f843d9cb4102508'
          pathlib.Path('/tmp/continuation.patch').write_bytes(lzma.decompress(body))
          PY
          git apply --index /tmp/continuation.patch
          git rm .github/workflows/continuation-source-transfer.yml
          test "$(git write-tree)" = 701d3e2474f16c538916c1009c61754544f0b5c9
          test "$(git ls-remote origin refs/heads/chat/repair-paraphrase-frontier-20260918-1931 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git commit -m 'Separate source summaries from inference and resume resolved repairs automatically'
          git push origin HEAD:refs/heads/chat/repair-paraphrase-frontier-20260918-1931
