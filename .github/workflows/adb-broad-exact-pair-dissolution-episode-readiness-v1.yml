name: ADB broad exact-pair dissolution episode readiness V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/adb_broad_exact_pair_dissolution_episode_readiness_v1.py'
      - 'reference/research/adb_broad_exact_pair_dissolution_semimarkov_freeze_v1.md'
      - '.github/workflows/adb-broad-exact-pair-dissolution-episode-readiness-v1.yml'

permissions:
  contents: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source-only episode-readiness audit
        run: python scripts/adb_broad_exact_pair_dissolution_episode_readiness_v1.py
      - name: Commit readiness artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_broad_exact_pair_dissolution_episode_readiness_v1.json
          if git diff --cached --quiet; then
            echo "Episode readiness unchanged"
          else
            git commit -m "Record dissolution episode readiness V1"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
