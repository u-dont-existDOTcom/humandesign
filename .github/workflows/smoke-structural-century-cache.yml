name: smoke-structural-century-cache

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Smoke structural century builder via CI')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Build and verify 30-day structural cache
        run: |
          python scripts/build_century_candidate_cache_fast.py \
            --ephemeris data/ephemeris \
            --output structural-smoke-cache \
            --start '1985-01-01T00:00:00Z' \
            --end-exclusive '1985-01-31T00:00:00Z' \
            --shard-years 100 \
            --root-tolerance-seconds 0.01 \
            --verify-every 25 \
            --generation-commit '${{ github.sha }}'
      - name: Upload smoke artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: structural-century-smoke-${{ github.sha }}
          path: structural-smoke-cache
          if-no-files-found: error
          retention-days: 7
