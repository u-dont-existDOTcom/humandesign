name: Partner multidomain 1000 benchmark V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/partner_multidomain_1000_v2.py'
      - 'reference/research/partner_multidomain_1000_freeze_v2.md'
      - 'scripts/partner_future_pilot.py'
      - 'scripts/partner_hd_timing_pilot.py'
      - 'scripts/fetch_swisseph_ephemeris.py'
      - '.github/workflows/partner-multidomain-1000-v2.yml'

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PySwissEph
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3'
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Run frozen multidomain 1000-partner benchmark
        run: python scripts/partner_multidomain_1000_v2.py
      - name: Commit V2 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/partner_multidomain_1000_results_v2.json
          if git diff --cached --quiet; then
            echo "Result unchanged"
          else
            git commit -m "Record multidomain partner null benchmark V2"
            git push
          fi
