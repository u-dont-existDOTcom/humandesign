name: ADB broad exact-pair history V4 final audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'reference/research/adb_broad_exact_pair_history_v4_h4.json'
      - '.github/workflows/adb-broad-exact-pair-history-v4-final-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen-source final V4 audit
        run: python scripts/adb_broad_exact_pair_history_v4_final_audit.py
      - name: Commit final V4 audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_broad_exact_pair_history_v4_final_audit.json
          if git diff --cached --quiet; then
            echo "V4 final audit unchanged"
          else
            git commit -m "Record broad exact-pair V4 final history audit"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
