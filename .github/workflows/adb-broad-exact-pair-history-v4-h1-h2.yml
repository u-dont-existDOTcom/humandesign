name: ADB broad exact-pair history V4 H1 H2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/adb_broad_exact_pair_history_v4_h1_h2.py'
      - 'reference/research/adb_broad_exact_pair_universe_v4.json'
      - 'reference/research/adb_broad_exact_pair_universe_freeze_v4.md'
      - '.github/workflows/adb-broad-exact-pair-history-v4-h1-h2.yml'

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3' numpy scikit-learn
      - name: Recover frozen H1 H2 histories
        run: python scripts/adb_broad_exact_pair_history_v4_h1_h2.py
      - name: Commit H1 H2 history audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_broad_exact_pair_history_v4_h1_h2.json
          if git diff --cached --quiet; then
            echo "V4 H1/H2 result unchanged"
          else
            git commit -m "Record broad exact-pair H1 H2 histories V4"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
