name: ADB C-sample pair-quality audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/adb_csample_pair_quality_audit.py'
      - '.github/workflows/adb-csample-pair-quality-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit pair-specific quality labels
        run: python scripts/adb_csample_pair_quality_audit.py
      - name: Commit aggregate quality audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_csample_pair_quality_audit_v1.json
          if git diff --cached --quiet; then
            echo "Pair-quality audit unchanged"
          else
            git commit -m "Record ADB pair-quality audit v1"
            git pull --rebase origin main
            git push
          fi
