name: smoke-century-global-backend

on:
  push:
  workflow_dispatch:

# End-to-end acceptance check against the immutable v2 century artifact.
permissions:
  contents: read
  actions: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Smoke century global backend via CI')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Download verified century cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p century-artifact
          gh run download 33088719809 \
            --repo "$GITHUB_REPOSITORY" \
            --name century-candidate-cache-62b0e6a4a1228f071a777f0fc4243dea67b40b59 \
            --dir century-artifact
          test -f century-artifact/manifest.json
      - name: Smoke real century-global participant backend
        run: |
          python scripts/smoke_century_global_backend.py \
            --ephemeris data/ephemeris \
            --mapping mappings/mapping_library_v1.json \
            --question-bank reference/core/question_bank_v1.json \
            --century-cache century-artifact \
            --code-commit '${{ github.sha }}' \
            --output century-global-backend-smoke.json
      - name: Upload smoke report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: century-global-backend-smoke-${{ github.sha }}
          path: century-global-backend-smoke.json
          if-no-files-found: error
          retention-days: 30
