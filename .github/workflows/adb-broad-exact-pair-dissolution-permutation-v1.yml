name: ADB broad exact-pair dissolution permutation V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/adb_broad_exact_pair_dissolution_permutation_v1.py'
      - 'scripts/adb_broad_exact_pair_dissolution_permutation_v1_parallel.py'
      - 'reference/research/adb_broad_exact_pair_dissolution_permutation_policy_v1.json'
      - 'reference/research/adb_broad_exact_pair_dissolution_feature_matrix_v1.json'
      - 'reference/research/adb_broad_exact_pair_dissolution_fit_results_v1.json'
      - '.github/workflows/adb-broad-exact-pair-dissolution-permutation-v1.yml'

permissions:
  contents: write

jobs:
  permute:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scikit-learn
      - name: Run frozen 500-permutation max-T test
        run: python scripts/adb_broad_exact_pair_dissolution_permutation_v1_parallel.py
      - name: Commit permutation result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_broad_exact_pair_dissolution_permutation_results_v1.json
          if git diff --cached --quiet; then
            echo "Permutation artifact unchanged"
          else
            git commit -m "Record dissolution V1 permutation test"
            git pull --rebase origin main
            git push
          fi
