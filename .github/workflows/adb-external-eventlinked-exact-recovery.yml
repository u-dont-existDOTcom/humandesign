name: ADB external event-linked exact recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/adb_external_eventlinked_exact_recovery.py'
      - '.github/workflows/adb-external-eventlinked-exact-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact external partner records
        run: python scripts/adb_external_eventlinked_exact_recovery.py
      - name: Commit compact recovery result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_external_eventlinked_exact_recovery_v1.json
          if git diff --cached --quiet; then
            echo "Recovery result unchanged"
          else
            git commit -m "Record external event-linked exact-time recovery"
            git pull --rebase origin main
            git push
          fi
