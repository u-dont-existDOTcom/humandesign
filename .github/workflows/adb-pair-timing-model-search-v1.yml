name: ADB pair timing model search V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/adb_pair_timing_model_search_v1.py'
      - 'reference/research/adb_pair_timing_model_search_freeze_v1.md'
      - '.github/workflows/adb-pair-timing-model-search-v1.yml'

permissions:
  contents: write

jobs:
  model-search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3' numpy scikit-learn
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Run frozen ADB pair timing model search
        run: python scripts/adb_pair_timing_model_search_v1.py
      - name: Commit model-search result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/adb_pair_timing_model_search_results_v1.json
          if git diff --cached --quiet; then
            echo "Model-search result unchanged"
          else
            git commit -m "Record ADB pair timing model search v1"
            git pull --rebase origin main
            git push
          fi
