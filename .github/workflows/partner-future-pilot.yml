name: Partner future SWIEPH pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/partner_future_pilot.py'
      - 'scripts/partner_hd_timing_pilot.py'
      - 'scripts/fetch_swisseph_ephemeris.py'
      - '.github/workflows/partner-future-pilot.yml'

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PySwissEph
        run: python -m pip install 'pyswisseph>=2.10.3.2,<3'
      - name: Fetch pinned Swiss ephemeris files
        run: python scripts/fetch_swisseph_ephemeris.py
      - name: Generate independent raw Western partner timelines
        run: python scripts/partner_future_pilot.py
      - name: Generate HD pair timing corroboration
        run: python scripts/partner_hd_timing_pilot.py
      - name: Commit raw forecast inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/research/partner_future_joel_bee_2026_2040_raw.json reference/research/partner_future_joel_bee_2026_2040_hd_raw.json
          if git diff --cached --quiet; then
            echo "Raw timeline unchanged"
          else
            git commit -m "Record Joel-Bee SWIEPH future pilot inputs"
            git push
          fi
