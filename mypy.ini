[mypy]
python_version = 3.11
strict = True
packages = hdmatch

# The development transfer bridge builds content-addressed Pydantic tasks from
# heterogeneous dict payloads. Runtime validation and dedicated tests cover the
# exact field contracts; mypy cannot preserve the per-key types through **dict.
[mypy-hdmatch.evaluation.development_transfer_corpus]
disable_error_code = arg-type

[mypy-hdmatch.evaluation.development_series_evidence]
disable_error_code = arg-type

# Starred tuples combine two sibling Pydantic task types; mypy widens the
# comprehension element to BaseModel even though both task classes expose the
# same corpus binding fields and runtime checks enforce a single corpus.
[mypy-hdmatch.evaluation.development_calibration_sampling]
disable_error_code = attr-defined

# The branch-specific response union is already narrowed by evidence_kind;
# this cast is retained for readability and exact schema dispatch.
[mypy-hdmatch.evaluation.development_annotation_pipeline]
disable_error_code = redundant-cast

# Participant theory exposure is explicitly runtime-narrowed to the two states
# permitted by the public-safe development package before model construction.
[mypy-hdmatch.evaluation.development_coding_package]
disable_error_code = arg-type
