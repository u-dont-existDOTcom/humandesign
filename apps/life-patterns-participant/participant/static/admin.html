<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life Patterns · Researcher</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/admin.js" defer></script></head><body><main><header><span class="eyebrow">PRIVATE RESEARCHER ACCESS</span><h1>Life Patterns</h1><p>Issue private participant invitations and download consented records.</p></header><p id="status" role="status"></p><section><h2>New participant or imported record</h2><p>Leave the file empty for a new participant. For an existing record, select its JSON file. Never upload birth or chart data.</p><label>Source type<select id="source-type"><option value="edited_response_record">Edited record</option><option value="prior_json">Prior JSON</option><option value="raw_transcript">Original transcript</option><option value="answer_only_notes">Notes</option></select></label><label>Collection mode<select id="source-mode"><option value="unknown">Unknown / not recorded</option><option value="chatgpt_voice">ChatGPT voice-first</option><option value="chatgpt_text">ChatGPT typed</option><option value="mixed">ChatGPT mixed voice + text</option><option value="railway_text">Railway typed</option></select></label><input type="file" id="record" accept=".json"><button id="create">Create private invitation</button><label>Invitation link<input id="link" readonly></label><button id="copy" class="secondary">Copy invitation</button></section><section><h2>Saved sessions</h2><button id="refresh" class="secondary">Refresh</button><div id="sessions"></div></section></main></body></html>
