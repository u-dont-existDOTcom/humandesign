{
  "openapi": "3.1.0",
  "info": {
    "title": "Life Patterns Independent Review Pilot",
    "version": "1.6.0",
    "description": "Asynchronous independent review and exact-source submission for the development pilot."
  },
  "servers": [
    {
      "url": "https://life-patterns-participant-production.up.railway.app"
    }
  ],
  "paths": {
    "/api/gpt/reviews": {
      "post": {
        "operationId": "startLifePatternsReview",
        "summary": "Queue independent review before primary freeze",
        "description": "Before calling, explain that one Allow sends the exact unfrozen record now; later clarification and final-storage calls are separate. Then say exactly: Please click Allow on this tool call to continue. Preserve the returned review ID.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Saved result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReviewStatus"
                }
              }
            }
          },
          "401": {
            "description": "Access credentials are missing or invalid."
          },
          "409": {
            "description": "The request is stale or conflicts with saved state."
          },
          "422": {
            "description": "Request rejected. Read safe errors[].path/code/hint; preserve exact backup and repair serialization or envelope only."
          }
        },
        "x-openai-isConsequential": true,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReviewStart"
              }
            }
          }
        }
      }
    },
    "/api/gpt/reviews/{review_id}": {
      "get": {
        "operationId": "getLifePatternsReview",
        "summary": "Check saved review status",
        "description": "Read the same saved review. Report review_stage_label, wait_guidance and recommended_check_after_seconds. Stage estimates are not deadlines. Queued/offline/overdue work has no reliable remaining-time promise. Do not poll repeatedly.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Saved result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReviewStatus"
                }
              }
            }
          },
          "401": {
            "description": "Access credentials are missing or invalid."
          },
          "409": {
            "description": "The request is stale or conflicts with saved state."
          },
          "422": {
            "description": "Invalid data; saved source remains unchanged."
          }
        },
        "parameters": [
          {
            "name": "review_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^R-[a-f0-9]{32}$"
            }
          }
        ],
        "x-openai-isConsequential": false
      }
    },
    "/api/gpt/reviews/{review_id}/clarifications": {
      "post": {
        "operationId": "submitLifePatternsClarification",
        "summary": "Save an exact clarification answer or explicit skip",
        "description": "Before calling, explain that this saves one clarification and a later status-retrieval call remains; another permission card may appear. Say exactly once: Please click Allow on this tool call to continue. Reuse operation_id on retries.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Saved result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReviewStatus"
                }
              }
            }
          },
          "401": {
            "description": "Access credentials are missing or invalid."
          },
          "409": {
            "description": "The request is stale or conflicts with saved state."
          },
          "422": {
            "description": "Invalid data; saved source remains unchanged."
          }
        },
        "x-openai-isConsequential": true,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ClarificationAnswer"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "review_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^R-[a-f0-9]{32}$"
            }
          }
        ]
      }
    },
    "/api/gpt/reviews/{review_id}/control": {
      "post": {
        "operationId": "controlLifePatternsReview",
        "summary": "Pause, resume, stop, or retry a saved review",
        "description": "Honor pause, stop or withdrawal. Withdrawal clears an unsubmitted review. Resume only when requested. Retry the same review only after a recoverable worker error or resource limit has been repaired; never create a replacement review.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Saved result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReviewStatus"
                }
              }
            }
          },
          "401": {
            "description": "Access credentials are missing or invalid."
          },
          "409": {
            "description": "The request is stale or conflicts with saved state."
          },
          "422": {
            "description": "Invalid data; saved source remains unchanged."
          }
        },
        "x-openai-isConsequential": true,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReviewControl"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "review_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^R-[a-f0-9]{32}$"
            }
          }
        ]
      }
    },
    "/api/gpt/reviewed-submissions": {
      "post": {
        "operationId": "submitLifePatternsRecords",
        "summary": "Submit independently reviewed frozen records",
        "description": "Before the one final storage call, say exactly: Please click Allow on this tool call to continue. Send both complete frozen records. If review_id is absent, recover only by unique exact-source ready-review match. Materialize any composite lacking full turns; never invent data.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Saved result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Receipt"
                }
              }
            }
          },
          "401": {
            "description": "Access credentials are missing or invalid."
          },
          "409": {
            "description": "The request is stale or conflicts with saved state."
          },
          "422": {
            "description": "Invalid data; saved source remains unchanged."
          }
        },
        "x-openai-isConsequential": true,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Submission"
              }
            }
          }
        }
      }
    },
    "/api/gpt/reviews/{review_id}/clarification-batches": {
      "post": {
        "operationId": "submitLifePatternsClarificationBatch",
        "summary": "Save an ordered batch of exact answers or skips",
        "description": "Before calling, explain this round has two calls: save answers now, retrieve later on return. Say: Please click Allow on this tool call to continue. After queued/processing, end the turn; do not call status automatically.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Saved result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReviewStatus"
                }
              }
            }
          },
          "401": {
            "description": "Access credentials are missing or invalid."
          },
          "409": {
            "description": "The request is stale or conflicts with saved state."
          },
          "422": {
            "description": "Invalid data; saved source remains unchanged."
          }
        },
        "x-openai-isConsequential": true,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ClarificationBatchAnswers"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "review_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^R-[a-f0-9]{32}$"
            }
          }
        ]
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "ReviewStart": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "research_use_consented": {
            "type": "boolean",
            "const": true
          },
          "request_id": {
            "type": "string",
            "minLength": 16,
            "maxLength": 80,
            "pattern": "^[a-zA-Z0-9_-]+$",
            "description": "Random per-operation identifier. Reuse the exact identifier and body when retrying."
          },
          "candidate_record": {
            "type": "object",
            "additionalProperties": true,
            "description": "Exact unfrozen primary source record with explicit consent and all source turns; no CF-003 answers.",
            "required": [
              "schema",
              "consent",
              "turns",
              "freeze"
            ],
            "properties": {
              "schema": {
                "type": "string",
                "const": "life-patterns-full-survey-participant-export-v2"
              },
              "consent": {
                "type": "object",
                "required": [
                  "research_use_consented"
                ],
                "properties": {
                  "research_use_consented": {
                    "type": "boolean",
                    "const": true
                  }
                },
                "additionalProperties": true
              },
              "turns": {
                "type": "array",
                "items": {
                  "type": "object",
                  "required": [
                    "question_text",
                    "answer_text"
                  ],
                  "properties": {
                    "turn_id": {
                      "type": "string"
                    },
                    "question_text": {
                      "type": [
                        "string",
                        "null"
                      ]
                    },
                    "answer_text": {
                      "type": [
                        "string",
                        "null"
                      ]
                    }
                  },
                  "additionalProperties": true
                }
              },
              "freeze": {
                "type": "object",
                "properties": {
                  "record_state": {
                    "type": "string",
                    "const": "candidate"
                  },
                  "frozen_before_birth_or_chart_reveal": {
                    "type": "boolean",
                    "const": false
                  }
                },
                "additionalProperties": true
              }
            }
          },
          "review_protocol": {
            "type": "string",
            "enum": [
              "legacy-v1",
              "fast-batch-v1"
            ],
            "description": "Use fast-batch-v1 for a new review. Recover an existing request with its unchanged saved body, including an omitted legacy protocol."
          }
        },
        "required": [
          "research_use_consented",
          "request_id",
          "candidate_record"
        ],
        "example": {
          "research_use_consented": true,
          "request_id": "0123456789abcdef0123456789abcdef",
          "candidate_record": {
            "schema": "life-patterns-full-survey-participant-export-v2",
            "consent": {
              "research_use_consented": true
            },
            "collection_mode": "chatgpt_text",
            "turns": [
              {
                "turn_id": "example-1",
                "question_text": "What usually helps you decide?",
                "answer_text": "I compare the practical options.",
                "canonical_question_id": null,
                "turn_role": "behavioral"
              }
            ],
            "participant_review": {
              "summary_shown": false
            },
            "freeze": {
              "record_state": "candidate",
              "frozen_before_birth_or_chart_reveal": false
            }
          },
          "review_protocol": "fast-batch-v1"
        }
      },
      "ClarificationAnswer": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "clarification_id": {
            "type": "string",
            "pattern": "^Q-[a-f0-9]{32}$"
          },
          "operation_id": {
            "type": "string",
            "minLength": 16,
            "maxLength": 80,
            "pattern": "^[a-zA-Z0-9_-]+$",
            "description": "Random per-operation identifier. Reuse the exact identifier and body when retrying."
          },
          "answer_text": {
            "type": "string",
            "maxLength": 20000
          },
          "skipped": {
            "type": "boolean"
          }
        },
        "required": [
          "clarification_id",
          "operation_id",
          "answer_text"
        ]
      },
      "ReviewControl": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "action": {
            "type": "string",
            "enum": [
              "pause",
              "resume",
              "stop",
              "retry",
              "withdraw"
            ]
          },
          "operation_id": {
            "type": "string",
            "minLength": 16,
            "maxLength": 80,
            "pattern": "^[a-zA-Z0-9_-]+$",
            "description": "Random per-operation identifier. Reuse the exact identifier and body when retrying."
          }
        },
        "required": [
          "action",
          "operation_id"
        ]
      },
      "Clarification": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "clarification_id": {
            "type": "string",
            "pattern": "^Q-[a-f0-9]{32}$"
          },
          "route_id": {
            "type": "string"
          },
          "route_type": {
            "type": "string",
            "enum": [
              "canonical",
              "context_repair",
              "missing_piece_followup"
            ]
          },
          "question_text": {
            "type": "string"
          },
          "participant_purpose": {
            "type": "string",
            "description": "Neutral plain-language explanation of the person-level pattern this question is testing; show it immediately before question_text."
          },
          "antecedent_turn_ids": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "required": [
          "clarification_id",
          "route_id",
          "route_type",
          "question_text",
          "participant_purpose",
          "antecedent_turn_ids"
        ]
      },
      "ReviewStatus": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "schema": {
            "type": "string",
            "const": "life-patterns-gpt-review-status-v1"
          },
          "review_id": {
            "type": "string",
            "pattern": "^R-[a-f0-9]{32}$"
          },
          "status": {
            "type": "string",
            "enum": [
              "queued",
              "processing",
              "clarification_needed",
              "ready",
              "error",
              "paused",
              "stopped",
              "resource_limited",
              "withdrawn"
            ]
          },
          "round": {
            "type": "integer",
            "minimum": 0
          },
          "duplicate": {
            "type": "boolean"
          },
          "clarification": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Clarification"
              },
              {
                "type": "null"
              }
            ]
          },
          "error": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "review_summary": {
            "anyOf": [
              {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "evidence_id": {
                      "type": "string"
                    },
                    "observation": {
                      "type": "string"
                    },
                    "conditions": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    },
                    "time_frame": {
                      "type": "string"
                    },
                    "relationship_context": {
                      "type": "string"
                    },
                    "source_quotes": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "additionalProperties": false,
                        "properties": {
                          "turn_id": {
                            "type": "string"
                          },
                          "quote": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "turn_id",
                          "quote"
                        ]
                      }
                    },
                    "measured_distinction": {
                      "type": "string"
                    },
                    "measurement_labels": {
                      "type": "array",
                      "minItems": 1,
                      "items": {
                        "type": "string"
                      }
                    },
                    "source_measurements": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "additionalProperties": false,
                        "properties": {
                          "turn_id": {
                            "type": "string"
                          },
                          "measurement_label": {
                            "type": "string"
                          }
                        },
                        "required": [
                          "turn_id",
                          "measurement_label"
                        ]
                      }
                    },
                    "split_for_display": {
                      "type": "boolean"
                    }
                  },
                  "required": [
                    "evidence_id",
                    "observation",
                    "conditions",
                    "time_frame",
                    "relationship_context",
                    "source_quotes",
                    "measured_distinction",
                    "measurement_labels",
                    "source_measurements",
                    "split_for_display"
                  ]
                }
              },
              {
                "type": "null"
              }
            ]
          },
          "source_review_status": {
            "type": "string"
          },
          "recommended_check_after_seconds": {
            "type": "integer",
            "minimum": 0,
            "description": "Suggested seconds before the participant checks this same saved review again. Zero means no waiting is recommended because the current state needs participant or final handling."
          },
          "review_protocol": {
            "type": "string"
          },
          "batch_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "clarifications": {
            "anyOf": [
              {
                "type": "array",
                "maxItems": 3,
                "items": {
                  "$ref": "#/components/schemas/Clarification"
                }
              },
              {
                "type": "null"
              }
            ]
          },
          "final_review_completed": {
            "type": "boolean"
          },
          "review_stage": {
            "type": "string"
          },
          "review_stage_label": {
            "type": "string"
          },
          "estimate_basis": {
            "type": [
              "string",
              "null"
            ]
          },
          "stage_elapsed_seconds": {
            "type": [
              "integer",
              "null"
            ]
          },
          "worker_heartbeat_age_seconds": {
            "type": [
              "integer",
              "null"
            ]
          },
          "estimate_exceeded": {
            "type": "boolean"
          },
          "worker_status_uncertain": {
            "type": "boolean"
          },
          "wait_guidance": {
            "type": "string"
          },
          "estimated_stage_seconds": {
            "anyOf": [
              {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "low": {
                    "type": "integer"
                  },
                  "high": {
                    "type": "integer"
                  }
                },
                "required": [
                  "low",
                  "high"
                ]
              },
              {
                "type": "null"
              }
            ]
          },
          "estimated_remaining_seconds": {
            "anyOf": [
              {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "low": {
                    "type": "integer"
                  },
                  "high": {
                    "type": "integer"
                  }
                },
                "required": [
                  "low",
                  "high"
                ]
              },
              {
                "type": "null"
              }
            ]
          },
          "action_forecast": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "phase": {
                "type": "string"
              },
              "known_service_calls_before_next_stable_result": {
                "type": "integer",
                "minimum": 0
              },
              "permission_cards_may_appear": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "low": {
                    "type": "integer"
                  },
                  "high": {
                    "type": "integer"
                  }
                },
                "required": [
                  "low",
                  "high"
                ]
              },
              "participant_message": {
                "type": "string"
              }
            },
            "required": [
              "phase",
              "known_service_calls_before_next_stable_result",
              "permission_cards_may_appear",
              "participant_message"
            ]
          }
        },
        "required": [
          "schema",
          "review_id",
          "status",
          "round",
          "duplicate",
          "recommended_check_after_seconds",
          "clarification",
          "error",
          "review_summary",
          "source_review_status",
          "action_forecast"
        ]
      },
      "Submission": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "research_use_consented": {
            "type": "boolean",
            "const": true
          },
          "review_id": {
            "type": "string",
            "pattern": "^R-[a-f0-9]{32}$",
            "description": "Optional: when missing, the service recovers a UNIQUE ready independent review by comparing every behavioral turn in the full frozen primary record. It never matches on name, DOB or partial source."
          },
          "primary_record_json": {
            "type": "string",
            "maxLength": 1500000,
            "description": "Exact frozen primary record serialized as one raw JSON object string; no markdown fences, summary or truncation."
          },
          "cf003_record_json": {
            "type": "string",
            "maxLength": 500000,
            "description": "Exact frozen CF-003 secondary record serialized as one raw JSON object string; no markdown fences, summary or truncation."
          }
        },
        "required": [
          "research_use_consented",
          "primary_record_json",
          "cf003_record_json"
        ]
      },
      "Receipt": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "schema": {
            "type": "string",
            "const": "life-patterns-gpt-submission-receipt-v1"
          },
          "submission_id": {
            "type": "string"
          },
          "received_at_utc": {
            "type": "string"
          },
          "duplicate": {
            "type": "boolean"
          },
          "review_id": {
            "type": "string",
            "pattern": "^R-[a-f0-9]{32}$"
          },
          "primary_record_sha256": {
            "type": "string"
          },
          "cf003_record_sha256": {
            "type": "string"
          },
          "stored_encrypted": {
            "type": "boolean"
          },
          "independent_review_completed": {
            "type": "boolean"
          },
          "inference_started": {
            "type": "boolean"
          }
        },
        "required": [
          "schema",
          "submission_id",
          "received_at_utc",
          "duplicate",
          "review_id",
          "primary_record_sha256",
          "cf003_record_sha256",
          "stored_encrypted",
          "independent_review_completed",
          "inference_started"
        ]
      },
      "BatchAnswer": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "clarification_id": {
            "type": "string",
            "pattern": "^Q-[a-f0-9]{32}$"
          },
          "answer_text": {
            "type": "string",
            "maxLength": 20000
          },
          "skipped": {
            "type": "boolean"
          }
        },
        "required": [
          "clarification_id",
          "answer_text",
          "skipped"
        ]
      },
      "ClarificationBatchAnswers": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "batch_id": {
            "type": "string",
            "pattern": "^B-[a-f0-9]{32}$"
          },
          "operation_id": {
            "type": "string",
            "minLength": 16,
            "maxLength": 80,
            "pattern": "^[a-zA-Z0-9_-]+$",
